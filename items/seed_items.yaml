- id: D8-ADY-008
  version: "0.1"
  split: public
  domain: D8
  cou: [B_code_in_validated_workflow]
  type: T7_agentic
  verification: deterministic
  difficulty: practitioner
  family_id: null
  prompt:
    template_id: TPL-A
    text: |
      Given a synthetic SDTM AE domain and a subject-level dataset with TRTSDT and TRTEDT,
      write R code producing an ADAE-style dataset with:
        - ASTDT / AENDT as dates,
        - ASTDY and AENDY as study days relative to TRTSDT,
        - TRTEMFL = "Y" for events with onset on or after TRTSDT and on or before
          TRTEDT + 30 days,
        - a flag for events with a partial or missing onset date, imputed conservatively
          (worst case: treated as treatment-emergent) with the imputation recorded in a
          separate variable.
      The code must handle subjects with no treatment start date without dropping them silently.
    attachments:
      - path: "data/synthetic_ae.csv"
        provenance: "Synthetically generated for this benchmark; no patient data. Generator script and seed included."
        sha256: "<fill on commit>"
      - path: "data/synthetic_adsl.csv"
        provenance: "Synthetically generated for this benchmark."
        sha256: "<fill on commit>"
  answer_key_ref: "_keys/D8-ADY-008.yaml"
  rubric:
    - criterion_id: C1
      text: "Study-day derivation omits day 0 (the classic off-by-one)."
      kind: required
      severity: S1
      weight: 3
      provenance: "CDISC ADaM Implementation Guide, study-day derivation."
    - criterion_id: C2
      text: "Does not drop rows or subjects as a side effect of a join or filter."
      kind: disqualifying
      severity: S1
      weight: 3
      provenance: "Silent record loss is a critical defect in a submission dataset."
  authoring:
    authors: ["<author 1>"]
    adjudicated: false
    source_date: "2026-08-07"
    post_cutoff_source: false

