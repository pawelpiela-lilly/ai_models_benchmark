- id: D2-GSD-012
  version: "0.1"
  split: public
  domain: D2
  cou: [B_code_in_validated_workflow, C_capability_tracking]
  type: T2_numeric
  verification: deterministic
  difficulty: expert
  family_id: D2-GSD-FAM
  prompt:
    template_id: TPL-A
    system: "You are supporting a statistician on a regulatory submission. Be precise and state your assumptions."
    text: |
      A two-arm superiority trial plans one interim analysis for efficacy at 50% of the
      planned information, with a one-sided overall type I error rate of 0.025. The team's
      draft SAP says only: "Efficacy boundaries will follow O'Brien-Fleming."

      Under the original O'Brien-Fleming boundary specification (z_k = c * sqrt(K/k), K = 2),
      report the nominal one-sided p-value threshold at the interim analysis.
  answer_key_ref: "_keys/D2-GSD-012.yaml"
  rubric:
    - criterion_id: C1
      text: "Reports the interim nominal p consistent with the classical two-look OBF boundary (z1 = 2.7965, nominal p = 0.002583), not the overall alpha (0.025) or the final-analysis threshold."
      kind: required
      severity: S1
      weight: 3
      provenance: "O'Brien & Fleming (1979); Jennison & Turnbull (2000), Ch. 2."
    - criterion_id: C2
      text: "Does not report the overall type I error rate (0.025) as if it were the interim nominal threshold."
      kind: disqualifying
      severity: S1
      weight: 3
      provenance: "As C1."
    - criterion_id: C3
      text: "States the assumed correlation structure of the sequential test statistics (rho = sqrt(information fraction))."
      kind: required
      severity: S3
      weight: 1
      provenance: "Jennison & Turnbull (2000), Ch. 3."
  perturbations:
    - kind: numeric_substitution
      text: "As above but with the interim at 60% of planned information."
      answer_key_delta: {note: "recompute; rho = sqrt(0.6)"}
    - kind: logical_inversion
      text: "As above but for a non-binding futility boundary with beta-spending; efficacy boundary fixed at the final analysis only."
      answer_key_delta: {note: "different key; tests whether the model transfers or pattern-matches"}
  authoring:
    authors: ["<author 1>"]
    reviewers: []
    adjudicated: false
    source_date: "2026-08-07"
    post_cutoff_source: false

