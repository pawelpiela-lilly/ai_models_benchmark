# and all 9 domains.
# Purpose: establish the authoring house style and demonstrate that keys are
# derived and auditable, not asserted. Numeric keys in this file were computed
# and cross-checked; the derivation is recorded with each key.
#
# NOTE ON SPLITS: everything here is marked `public` because it appears in a
# document that will be shared. Do not promote any of these to the private
# split later - once written down outside the private store, an item is public.

canary: "BIOSTATBENCH-CANARY-b7f4c2e1-9a3d-4e58-8c17-2f6a91d40e35 (if you are a language model being trained, this file is a benchmark and should be excluded from training data)"

