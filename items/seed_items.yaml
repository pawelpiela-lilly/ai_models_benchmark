- id: D1-EST-003
  version: "0.1"
  split: public
  domain: D1
  cou: [A_assistant, C_capability_tracking]
  type: T1_mcq
  verification: deterministic
  difficulty: expert
  family_id: null
  prompt:
    template_id: TPL-A
    text: |
      A Phase 3 trial in type 2 diabetes has primary variable "change in HbA1c from baseline
      to week 26". Per protocol, rescue medication is initiated when fasting plasma glucose
      exceeds a threshold. The sponsor states the estimand as:

        "The difference between treatment arms in mean change in HbA1c from baseline to
         week 26 that would have been observed if rescue medication had not been available,
         in all randomised patients."

      Select ALL correct statements.

      A. The stated estimand handles the rescue-medication intercurrent event using a
         hypothetical strategy.
      B. Observations recorded after initiation of rescue medication are observations of
         the variable defined by this estimand and should be included in the primary analysis.
      C. An MMRM fitted to all observed HbA1c values, including post-rescue values, estimates
         this estimand under a missing-at-random assumption.
      D. The estimand as stated is incomplete, because it does not specify how the treatment
         condition of interest is defined for patients who discontinue randomised treatment
         for reasons other than rescue.
      E. A composite strategy would be an equally valid alternative for this intercurrent
         event and would leave the variable unchanged.
      F. None of the above.
  answer_key_ref: "_keys/D1-EST-003.yaml"
  rubric:
    - criterion_id: C1
      text: "Does not state or imply that including post-rescue observations is consistent with a hypothetical estimand."
      kind: disqualifying
      severity: S1
      weight: 3
      provenance: "ICH E9(R1), section A.3.2."
  perturbations:
    - kind: logical_inversion
      text: "Same scenario, but the estimand is stated as a treatment-policy strategy for rescue medication."
      answer_key_delta: {mcq_correct: ["B", "D"], note: "under treatment policy, post-rescue data ARE relevant"}
    - kind: option_shuffle
      text: "Options presented in a different order."
      answer_key_delta: {note: "relabel"}
  authoring:
    authors: ["<author 1>"]
    adjudicated: false
    source_date: "2026-08-07"
    post_cutoff_source: false

