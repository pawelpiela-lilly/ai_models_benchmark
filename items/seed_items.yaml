- id: D2-GSD-014
  version: "0.1"
  split: public
  domain: D2
  cou: [B_code_in_validated_workflow, C_capability_tracking]
  type: T2_numeric
  verification: deterministic
  difficulty: expert
  family_id: D2-GSD-FAM
  prompt:
    template_id: TPL-A
    system: "You are supporting a statistician on a regulatory submission. Be precise and state your assumptions."
    text: |
      A two-arm superiority trial plans one interim analysis for efficacy at 50% of the
      planned information, with a one-sided overall type I error rate of 0.025. The team's
      draft SAP says only: "Efficacy boundaries will follow O'Brien-Fleming."

      The team is told that "O'Brien-Fleming" could instead mean the Lan-DeMets
      O'Brien-Fleming-like alpha-spending function (gsDesign::sfLDOF), evaluated at the same
      information fraction. Report the nominal one-sided p-value threshold at the interim
      analysis under this spending function, and state whether the SAP text as written
      ("Efficacy boundaries will follow O'Brien-Fleming") is sufficient to remove the
      ambiguity between the two boundary families.
  answer_key_ref: "_keys/D2-GSD-014.yaml"
  rubric:
    - criterion_id: C1
      text: "Reports the LD-OBF-like spending interim nominal p (0.001525), materially different from the original-OBF interim threshold (0.002583)."
      kind: required
      severity: S1
      weight: 3
      provenance: "Lan & DeMets (1983); FDA Adaptive Designs guidance (2019)."
    - criterion_id: C2
      text: "States that 'O'Brien-Fleming' alone is ambiguous between the original boundary family and the Lan-DeMets OBF-like spending function, and that the SAP text as written is insufficient because it does not disambiguate them."
      kind: required
      severity: S1
      weight: 3
      provenance: "As C1; FDA Adaptive Designs guidance (2019) requires prespecification of the alpha-spending approach, not just the boundary's shape family."
    - criterion_id: C3
      text: "Does not present the interim boundary as if the choice of spending function were immaterial to the sufficiency question."
      kind: disqualifying
      severity: S1
      weight: 3
      provenance: "As C2."
  perturbations:
    - kind: numeric_substitution
      text: "As above but with the interim at 60% of planned information."
      answer_key_delta: {note: "recompute; rho = sqrt(0.6)"}
    - kind: logical_inversion
      text: "As above but for a non-binding futility boundary with beta-spending; efficacy boundary fixed at the final analysis only."
      answer_key_delta: {note: "different key; tests whether the model transfers or pattern-matches"}
  authoring:
    authors: ["<author 1>"]
    reviewers: []
    adjudicated: false
    source_date: "2026-08-07"
    post_cutoff_source: false

