- id: D6-RAR-002
  version: "0.1"
  split: public
  domain: D6
  cou: [A_assistant, B_code_in_validated_workflow]
  type: T2_numeric
  verification: deterministic
  difficulty: practitioner
  family_id: null
  prompt:
    template_id: TPL-A
    text: |
      In a safety analysis of a randomised trial, an adverse event of special interest
      occurred in 0 of 200 patients on placebo and 6 of 200 patients on active treatment.
      Report a point estimate and a two-sided 95% confidence interval for the between-arm
      difference in the proportion of patients with at least one event, and state which
      effect measure you would present in the CSR and why.
  answer_key_ref: "_keys/D6-RAR-002.yaml"
  rubric:
    - criterion_id: C1
      text: "Presents the risk difference as the primary measure, with reasoning that ratio measures (OR, RR) are undefined or unstable when a cell count is zero."
      kind: required
      severity: S1
      weight: 3
      provenance: "Standard rare-event practice; consistent with CIOMS and with ICH E3 safety presentation expectations."
    - criterion_id: C2
      text: "If a continuity correction or 0.5 cell addition is used, it is named, justified, and accompanied by a sensitivity analysis without it."
      kind: required
      severity: S2
      weight: 2
      provenance: "Sweeting, Sutton & Lambert (2004), Stat Med, on the bias of the 0.5 correction with sparse data."
    - criterion_id: C3
      text: "Uses a confidence interval method appropriate for a zero cell and names it (Newcombe hybrid score, Miettinen-Nurminen, or Agresti-Caffo)."
      kind: alternative
      alternative_group: "CI-method"
      severity: S2
      weight: 2
      provenance: "Newcombe (1998), Stat Med 17:873-890."
    - criterion_id: C4
      text: "Reports a Wald interval on the risk difference without noting its failure with a zero cell, or reports an odds ratio as the primary measure."
      kind: disqualifying
      severity: S1
      weight: 3
      provenance: "As C1, C3."
    - criterion_id: C5
      text: "Notes that exposure-adjusted incidence would be preferred if exposure duration differs materially between arms."
      kind: required
      severity: S3
      weight: 1
      provenance: "Standard safety analytics practice for events with differing exposure."
  authoring:
    authors: ["<author 1>"]
    adjudicated: false
    source_date: "2026-08-07"
    post_cutoff_source: false

