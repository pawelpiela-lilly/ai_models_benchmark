- id: D5-MULT-006
  version: "0.1"
  split: public
  domain: D5
  cou: [A_assistant, B_code_in_validated_workflow]
  type: T2_numeric
  verification: deterministic
  difficulty: practitioner
  family_id: null
  prompt:
    template_id: TPL-A
    text: |
      A trial uses the graphical approach of Bretz et al. (2009) with overall one-sided
      alpha = 0.025 and four hypotheses.

        Initial weights: H1 = 0.5, H2 = 0.5, H3 = 0, H4 = 0
        Edges (all transition weights = 1): H1 -> H3, H3 -> H2, H2 -> H4, H4 -> H1

      H1 is rejected at its available level. H3 is then tested and also rejected.
      What alpha level is available for testing H2 at that point? Show the weight updates.
  answer_key_ref: "_keys/D5-MULT-006.yaml"
  rubric:
    - criterion_id: C1
      text: "Shows the weight updates rather than only the final number."
      kind: required
      severity: S2
      weight: 2
      provenance: "Bretz, Maurer, Brannath & Posch (2009), Stat Med 28:586-604."
    - criterion_id: C2
      text: "Does not claim that alpha can be recycled to a hypothesis before the donor hypothesis is rejected."
      kind: disqualifying
      severity: S1
      weight: 3
      provenance: "Closed-testing requirement underlying the graphical approach."
  perturbations:
    - kind: numeric_substitution
      text: "Same graph but with transition weights H1 -> H3 = 0.6 and H1 -> H4 = 0.4."
      answer_key_delta: {note: "recompute; tests arithmetic rather than recall of a worked example"}
  authoring:
    authors: ["<author 1>"]
    adjudicated: false
    source_date: "2026-08-07"
    post_cutoff_source: false

