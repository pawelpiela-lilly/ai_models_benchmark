- id: D4-REC-005
  version: "0.1"
  split: public
  domain: D4
  cou: [A_assistant, C_capability_tracking]
  type: T1_mcq
  verification: deterministic
  difficulty: expert
  family_id: null
  prompt:
    template_id: TPL-A
    text: |
      A heart-failure trial has recurrent hospitalisations for heart failure as an endpoint.
      All-cause death is frequent and differs between arms. Select ALL correct statements.

      A. A negative binomial analysis of hospitalisation counts with log exposure time as an
         offset treats death as non-informative censoring, and the resulting rate ratio can be
         biased when mortality differs between arms.
      B. The LWYY model (Andersen-Gill with a robust sandwich variance) targets a ratio of mean
         cumulative functions and shares the same limitation with respect to the terminal event.
      C. A win ratio in which death is the highest-priority component addresses the terminal
         event by construction.
      D. Joint frailty models and while-alive estimands are alternatives that handle the terminal
         event explicitly.
      E. Because death is a competing risk, a Fine-Gray subdistribution hazard model for the first
         hospitalisation preserves the recurrent-event information.
      F. None of the above.
  answer_key_ref: "_keys/D4-REC-005.yaml"
  authoring:
    authors: ["<author 1>"]
    adjudicated: false
    source_date: "2026-08-07"
    post_cutoff_source: false

