- id: D9-DEF-009
  version: "0.1"
  split: public
  domain: D9
  cou: [A_assistant]
  type: T4_defect
  verification: judge_calibrated
  difficulty: practitioner
  family_id: null
  prompt:
    template_id: TPL-A
    text: |
      Review the following excerpt from a draft statistical analysis plan for a non-inferiority
      trial. List every methodological defect you find, and for each state why it is a defect
      and what should be done instead. Do not comment on formatting.

      ---
      "6.1 Analysis populations. The primary analysis population will be the per-protocol set,
      since the intention-to-treat set is anti-conservative for non-inferiority.

      6.2 Covariates. Baseline covariates will be compared between arms using two-sample
      t-tests; any covariate with p < 0.10 will be included as a covariate in the ANCOVA model.

      6.3 Missing data. Missing week-24 values will be imputed by last observation carried forward.

      6.4 Non-inferiority margin. The non-inferiority margin is 10 percentage points, which is
      clinically accepted.

      6.5 Testing. The primary endpoint and both key secondary endpoints will each be tested at
      the two-sided 0.05 level.

      6.6 Interpretation. Statistical significance will be declared if p < 0.05. If the result is
      not statistically significant, equivalence of the two treatments will be concluded.

      6.7 Software. Analyses will be performed using SAS."
      ---
  answer_key:
    reference_artefact: "defect list below; scored by severity-weighted recall and precision"
  rubric:
    - criterion_id: DEF1
      text: "Identifies that PP alone as the primary population for a non-inferiority trial is not a solution to ITT's anti-conservatism; PP is subject to post-randomisation selection bias, and both ITT and PP analyses are expected with consistency assessed."
      kind: required
      severity: S1
      weight: 3
      provenance: "FDA Non-Inferiority Clinical Trials guidance (2016), section on analysis populations; ICH E9 section 5.2."
    - criterion_id: DEF2
      text: "Identifies significance testing of baseline covariates to select model covariates as invalid; covariates should be prespecified on clinical/prognostic grounds."
      kind: required
      severity: S1
      weight: 3
      provenance: "FDA Adjusting for Covariates guidance (2023); ICH E9 section 5.7."
    - criterion_id: DEF3
      text: "Identifies LOCF as the primary missing-data handling as indefensible without estimand alignment and sensitivity analysis; recommends an estimand-aligned approach (MMRM under MAR, or reference-based MI) with prespecified sensitivity analyses."
      kind: required
      severity: S1
      weight: 3
      provenance: "ICH E9(R1); NRC (2010) report on missing data in clinical trials."
    - criterion_id: DEF4
      text: "Identifies that the non-inferiority margin is asserted rather than justified; requires justification from the historical evidence for the active control's effect versus placebo, with the statistical and clinical components of the margin separated and cited."
      kind: required
      severity: S1
      weight: 3
      provenance: "FDA Non-Inferiority Clinical Trials guidance (2016), sections III-IV."
    - criterion_id: DEF5
      text: "Identifies absence of multiplicity control across the primary and two key secondary endpoints."
      kind: required
      severity: S2
      weight: 2
      provenance: "FDA Multiple Endpoints in Clinical Trials guidance (2022)."
    - criterion_id: DEF6
      text: "Identifies the interpretation error in 6.6: a non-significant superiority test is not evidence of equivalence, and a non-inferiority conclusion requires the CI for the treatment difference to exclude the margin, not a null p-value."
      kind: required
      severity: S1
      weight: 3
      provenance: "ICH E9 section 3.3.2; Altman & Bland (1995), BMJ."
    - criterion_id: DEF7
      text: "Notes that 6.7 does not pin a software version or environment, which is a reproducibility gap."
      kind: required
      severity: S3
      weight: 1
