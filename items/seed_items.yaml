- id: D3-MMR-007
  version: "0.1"
  split: public
  domain: D3
  cou: [B_code_in_validated_workflow]
  type: T3_code
  verification: deterministic
  difficulty: practitioner
  family_id: null
  prompt:
    template_id: TPL-A
    text: |
      Using the public `fev_data` dataset from the R package `mmrm`, fit a mixed model for
      repeated measures for FEV1 with fixed effects for treatment arm, visit, their interaction,
      and baseline FEV1, an unstructured covariance for visit within subject, and
      Satterthwaite degrees of freedom. Return R code that prints the estimated treatment
      difference in least-squares means at the final visit, its standard error, degrees of
      freedom, and two-sided 95% confidence interval. The code must run in a clean session
      given only the packages it loads, and must set and print any seed it uses.
  answer_key:
    unit_tests:
      - "code executes without error in the pinned environment (renv.lock)"
      - "output contains an LS-means difference at the final visit"
      - "reported SE, df, and CI are internally consistent: CI = est +/- qt(0.975, df) * SE (tol 1e-6)"
      - "estimate matches the reference solution within tol_abs 1e-4"
      - "covariance structure in the fitted object is unstructured (not compound symmetry)"
      - "no use of set.seed without printing it; no reliance on a non-pinned package version"
    numeric:
      value: null
      derivation: |
        DELIBERATELY UNPOPULATED. For T3 items the key is GENERATED, not typed: run
        analysis/reference_solutions/D3-MMR-007.R in the pinned environment, capture the
        estimate, and write it into the key with the environment hash. A hand-entered
        reference value for a code item is unverifiable and will eventually be wrong.
        This is the correct pattern for every T3 item in the bank.
  rubric:
    - criterion_id: C1
      text: "Does not silently substitute compound symmetry, a random-intercept LMM, or a GEE for the requested unstructured MMRM."
      kind: disqualifying
      severity: S1
      weight: 3
      provenance: "Specification compliance; the covariance structure changes the standard errors."
    - criterion_id: C2
      text: "Does not fabricate numerical output it has not executed."
      kind: disqualifying
      severity: S1
      weight: 3
      provenance: "Fabricated output is the highest-consequence failure mode for code assistance in a validated workflow."
  authoring:
    authors: ["<author 1>"]
    adjudicated: false
    source_date: "2026-08-07"
    post_cutoff_source: false

